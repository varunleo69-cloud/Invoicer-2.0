name: Invoicer CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/varunleo69-cloud/invoicer

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22   # same major version as the Docker image
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  build-and-push:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build frontend image
        run: |
          docker build \
            -t ${{ env.IMAGE_PREFIX }}-frontend:${{ github.sha }} \
            -t ${{ env.IMAGE_PREFIX }}-frontend:latest \
            ./frontend

      - name: Build backend image
        run: |
          docker build \
            -t ${{ env.IMAGE_PREFIX }}-backend:${{ github.sha }} \
            -t ${{ env.IMAGE_PREFIX }}-backend:latest \
            .

      - name: Push frontend image
        run: |
          docker push ${{ env.IMAGE_PREFIX }}-frontend:${{ github.sha }}
          docker push ${{ env.IMAGE_PREFIX }}-frontend:latest

      - name: Push backend image
        run: |
          docker push ${{ env.IMAGE_PREFIX }}-backend:${{ github.sha }}
          docker push ${{ env.IMAGE_PREFIX }}-backend:latest

  deploy:
    runs-on: self-hosted
    needs: build-and-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    # Never run two deployments at the same time
    concurrency:
      group: deploy-production
      cancel-in-progress: false

    permissions:
      contents: read
      packages: read

    env:
      # Deploy the exact images built for this commit (not ":latest"),
      # so every deployment can be rolled back to a known SHA.
      IMAGE_TAG: ${{ github.sha }}
      # Repository secret: Settings > Secrets and variables > Actions > DB_PASSWORD
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull images for this commit
        run: |
          docker compose -f docker-compose.prod.yml pull

      - name: Deploy application
        run: |
          # --wait blocks until every service with a healthcheck is healthy
          docker compose -f docker-compose.prod.yml up -d --remove-orphans --wait --wait-timeout 180

      - name: Smoke test through the load balancer
        run: |
          curl -fsS http://localhost:8081/health
          curl -fsS http://localhost:8081/api/v1/invoices > /dev/null
          docker compose -f docker-compose.prod.yml ps

      - name: Show logs if the deployment failed
        if: failure()
        run: |
          docker compose -f docker-compose.prod.yml ps || true
          docker compose -f docker-compose.prod.yml logs --tail=60 || true
