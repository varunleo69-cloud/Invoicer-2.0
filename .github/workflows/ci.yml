name: Invoicer CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/varunleo69-cloud/invoicer
  K8S_NAMESPACE: invoicer

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  build-and-push:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push frontend image
        run: |
          docker build \
            -t ${{ env.IMAGE_PREFIX }}-frontend:${{ github.sha }} \
            ./frontend
          docker push ${{ env.IMAGE_PREFIX }}-frontend:${{ github.sha }}

      - name: Build and push backend image
        run: |
          docker build \
            -t ${{ env.IMAGE_PREFIX }}-backend:${{ github.sha }} \
            .
          docker push ${{ env.IMAGE_PREFIX }}-backend:${{ github.sha }}

  deploy:
    runs-on: self-hosted
    needs: build-and-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read
    env:
      IMAGE_TAG: ${{ github.sha }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Verify Kubernetes access
        run: |
          kubectl config current-context
          kubectl get nodes

      - name: Verify Minikube
        run: |
          minikube status

      - name: Apply Kubernetes manifests
        run: |
          kubectl apply -f k8s/invoicer.yaml

      - name: Create or update database secret
        run: |
          test -n "$DB_PASSWORD"
          kubectl -n "$K8S_NAMESPACE" create secret generic invoicer-db \
            --from-literal=DB_PASSWORD="$DB_PASSWORD" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Update application images
        run: |
          kubectl -n "$K8S_NAMESPACE" set image deployment/backend \
            backend=${{ env.IMAGE_PREFIX }}-backend:${{ env.IMAGE_TAG }}
          kubectl -n "$K8S_NAMESPACE" set image deployment/frontend \
            frontend=${{ env.IMAGE_PREFIX }}-frontend:${{ env.IMAGE_TAG }}

      - name: Wait for rollout
        run: |
          kubectl -n "$K8S_NAMESPACE" rollout status deployment/postgres --timeout=180s
          kubectl -n "$K8S_NAMESPACE" rollout status deployment/backend --timeout=180s
          kubectl -n "$K8S_NAMESPACE" rollout status deployment/frontend --timeout=180s
          kubectl -n "$K8S_NAMESPACE" rollout status deployment/nginx --timeout=180s

      - name: Smoke test
        run: |
          URL=$(minikube service nginx -n "$K8S_NAMESPACE" --url)
          echo "Testing $URL"
          curl -fsS "$URL/health"
          curl -fsS "$URL/api/v1/invoices" > /dev/null

      - name: Show status if deployment failed
        if: failure()
        run: |
          kubectl get pods -n "$K8S_NAMESPACE" -o wide || true
          kubectl get services -n "$K8S_NAMESPACE" || true
          kubectl describe pods -n "$K8S_NAMESPACE" || true
