# Same application as Jenkins / GitHub Actions: nginx -> backend replicas -> postgres.
# Assumes a GitLab runner with the host Docker socket mounted (as before).
stages:
  - test
  - build
  - deploy

variables:
  COMPOSE_PROJECT_NAME: invoicer-gitlab   # separate stack from the Jenkins one
  HTTP_PORT: "8082"                       # so both can run on the same host

test-app:
  stage: test
  image: node:22-alpine
  script:
    - npm ci
    - npm test

build-images:
  stage: build
  image: docker:27-cli
  script:
    - docker compose build

deploy-stack:
  stage: deploy
  image: docker:27-cli
  script:
    - docker compose up -d --remove-orphans --wait --wait-timeout 120
    # localhost inside a job container is not the host, so test from inside the
    # nginx container: this still covers nginx -> backend -> database.
    - docker compose exec -T nginx wget -qO- http://127.0.0.1/health
    - docker compose exec -T nginx wget -qO /dev/null http://127.0.0.1/api/v1/invoices
    - docker compose ps
  after_script:
    - docker compose ps || true
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
