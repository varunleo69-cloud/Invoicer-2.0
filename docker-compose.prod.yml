# Production stack: nginx (load balancer) -> backend x5 -> postgres
# Images come from GHCR. Required environment variables:
#   DB_PASSWORD  (no default on purpose - deploy fails if it is missing)
#   IMAGE_TAG    (optional, default "latest"; CI sets the commit SHA.
#                 Roll back by running with an older SHA.)
name: invoicer20

services:
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8081:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      frontend:
        condition: service_started
      backend:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    image: ghcr.io/varunleo69-cloud/invoicer-frontend:${IMAGE_TAG:-latest}
    expose:
      - "80"
    restart: unless-stopped

  backend:
    image: ghcr.io/varunleo69-cloud/invoicer-backend:${IMAGE_TAG:-latest}
    deploy:
      replicas: 5
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: invoicer
      DB_USER: invoicer
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}
      FRONTEND_ORIGIN: http://localhost:8081
    expose:
      - "3000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: invoicer
      POSTGRES_USER: invoicer
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U invoicer -d invoicer"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  postgres_data:
