name: invoicer20

services:
  frontend:
    image: ghcr.io/varunleo69-cloud/invoicer-frontend:latest
    ports:
      - "8081:80"
    depends_on:
      - backend

  backend:
    image: ghcr.io/varunleo69-cloud/invoicer-backend:latest
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: invoicer
      DB_USER: invoicer
      DB_PASSWORD: invoicer_dev_password
      FRONTEND_ORIGIN: http://localhost:8081
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: invoicer
      POSTGRES_USER: invoicer
      POSTGRES_PASSWORD: invoicer_dev_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U invoicer -d invoicer"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
