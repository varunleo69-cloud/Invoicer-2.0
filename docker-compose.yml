# Local / CI stack:  nginx (load balancer)  ->  backend x2  ->  postgres
#                                           ->  frontend (static files)
# Open http://localhost:8080  (change with HTTP_PORT)
services:
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${HTTP_PORT:-8080}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      frontend:
        condition: service_started
      backend:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    expose:
      - "80"
    restart: unless-stopped

  backend:
    build:
      context: .
    # Two replicas locally so the load balancer is really exercised.
    deploy:
      replicas: 2
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: invoicer
      DB_USER: invoicer
      # Dev/CI default only. Put your own value in .env (see .env.example).
      DB_PASSWORD: ${DB_PASSWORD:-invoicer_dev_password}
      FRONTEND_ORIGIN: http://localhost:${HTTP_PORT:-8080}
    expose:
      - "3000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: invoicer-postgres
    environment:
      POSTGRES_DB: invoicer
      POSTGRES_USER: invoicer
      POSTGRES_PASSWORD: ${DB_PASSWORD:-invoicer_dev_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U invoicer -d invoicer"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  postgres_data:
