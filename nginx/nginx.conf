# Load balancer / single entry point for both docker-compose.yml (dev, CI) and
# docker-compose.prod.yml. It only relies on the service names "backend" and
# "frontend", so the same file works for any number of backend replicas.
events {}

http {
    # Docker's embedded DNS. Names are re-resolved every 5 seconds, so nginx
    # keeps working after a redeploy gives the containers new IP addresses
    # (a plain "upstream" block resolves names only once, at startup).
    # If a name resolves to several IPs (one per replica), nginx round-robins them.
    resolver 127.0.0.11 valid=5s ipv6=off;

    server {
        listen 80;
        server_name _;

        set $backend_upstream  http://backend:3000;
        set $frontend_upstream http://frontend:80;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 3s;
        # If one replica is down or slow, try the next one
        proxy_next_upstream error timeout http_502 http_503;

        location /api/ {
            proxy_pass $backend_upstream;
        }

        location = /health {
            proxy_pass $backend_upstream;
        }

        location / {
            proxy_pass $frontend_upstream;
        }
    }
}
